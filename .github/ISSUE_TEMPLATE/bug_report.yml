name: 🐛 Bug report
description: Something isn't working in LogcatOn
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! The more detail you give, the faster it gets fixed.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. macOS 26.1 / Windows 11 24H2 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: LogcatOn version
      description: The release tag you downloaded (shown on the release page)
      placeholder: v0.4.2
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Installer (.dmg / -setup.exe / .msi / .AppImage / .deb / .rpm)
        - Portable archive
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect a device …
        2. Select package …
        3. …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Anything that helps — terminal output, screenshots, screen recordings.
