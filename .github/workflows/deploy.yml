name: Deploy Pages

# 릴리즈가 이 레포에 publish/edit/delete 될 때마다(logcat-on CI 가 등록) +
# main push 시 페이지를 다시 빌드해 GitHub Pages 로 배포한다.
# 사전 조건(1회): Settings → Pages → Source = "GitHub Actions".
on:
  release:
    # `published` 하나로 일반·프리릴리즈 publish 모두 커버된다.
    # `released`/`prereleased` 는 `published` 와 동시에 발사돼 run 이 2개
    # 생기고, concurrency(pages) 충돌로 deploy 가 죽는 레이스를 만들었음
    # (v1.0.0 첫 릴리즈에서 실제 발생) — 구독하지 않는다.
    types: [published, unpublished, edited, deleted]
  push:
    branches: [main]
  # 매일 1회 재빌드 — 릴리즈 자산 download_count(스탯 표시용) 최신화
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read   # 자기 레포 릴리즈 조회 (기본 GITHUB_TOKEN 으로 충분)
  pages: write     # deploy-pages
  id-token: write  # deploy-pages OIDC

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 이 레포의 릴리즈를 dist/releases.json 으로 베이크 (npm 의존성 0)
      - name: Build releases.json
        run: node scripts/build-releases.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble dist
        run: |
          cp index.html .nojekyll robots.txt bd7f09c5510dff62fcf2a0addf3aa865.txt google86229c58688d70fc.html dist/
          cp -r assets video dist/

      # SEO: 릴리즈 노트를 정적 HTML 로 베이크(JS 미실행 크롤러 대응) +
      # JSON-LD 버전 주입 + sitemap.xml 생성
      - name: Prerender for SEO
        run: node scripts/prerender.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow — 배포 성공 시 참여 검색엔진(Bing·Naver·Yandex·Seznam 등)에
  # 즉시 색인 핑. api.indexnow.org 한 곳에 보내면 컨소시엄 전체로 전파된다.
  # (Google 은 IndexNow 미지원 — Search Console sitemap 경로로 커버.)
  # 핑은 best-effort: 실패해도 배포 결과를 깨뜨리지 않는다(|| true).
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Ping IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "qwerfunch.github.io",
              "key": "bd7f09c5510dff62fcf2a0addf3aa865",
              "keyLocation": "https://qwerfunch.github.io/logcat-on-releases/bd7f09c5510dff62fcf2a0addf3aa865.txt",
              "urlList": [
                "https://qwerfunch.github.io/logcat-on-releases/",
                "https://qwerfunch.github.io/logcat-on-releases/?lang=ko",
                "https://qwerfunch.github.io/logcat-on-releases/?lang=ja",
                "https://qwerfunch.github.io/logcat-on-releases/?lang=zh"
              ]
            }' -w "\nIndexNow HTTP %{http_code}\n" || true
